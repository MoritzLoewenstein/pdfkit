<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDFKit Playground</title>
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>PDFKit Playground</h1>
        <p>Edit the JavaScript to update the PDF. Your edits are saved in this browser.</p>
        <p>Only run code you trust.</p>
      </div>
      <a href="./examples_2/index.html">Fixed preview</a>
    </header>
    <main class="workspace">
      <section class="panel editor-panel" aria-labelledby="editor-heading">
        <h2 id="editor-heading">JavaScript</h2>
        <div id="editor"></div>
        <div id="error-panel" class="error-panel" role="alert" hidden>
          <strong id="error-title"></strong>
          <p id="error-message"></p>
          <details id="error-details">
            <summary>Stack trace</summary>
            <pre id="error-stack"></pre>
          </details>
        </div>
      </section>
      <section class="panel preview-panel" aria-labelledby="preview-heading">
        <h2 id="preview-heading">PDF Preview</h2>
        <iframe id="preview" title="Generated PDF preview"></iframe>
      </section>
    </main>
    <script type="module" src="./examples/playground/main.js"></script>
  </body>
</html>
